<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Heart Protocol</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0d0208;
            color: #ff2a6d;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* กรอบจำลองมือถือ */
        .phone-frame {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 420px;
            max-height: 860px;
            background: #0d0208;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 50px rgba(255, 42, 109, 0.25);
        }

        @media (min-width: 480px) {
            .phone-frame {
                height: 90vh;
                border-radius: 40px;
                border: 8px solid #220a16;
            }
        }

        /* กล่องข้อความแบบ Terminal */
        .card-box {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 88%;
            background: rgba(20, 5, 12, 0.92);
            padding: 25px 20px;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(255, 42, 109, 0.3);
            border: 1px solid rgba(255, 42, 109, 0.35);
            font-family: 'Courier New', Courier, monospace;
            z-index: 10;
            transition: opacity 0.5s ease, transform 0.5s ease, visibility 0.5s ease;
            position: absolute;
        }

        .line {
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            line-height: 1.4;
        }

        .system { color: #ff2a6d; }
        .status { color: #00ff66; font-weight: bold; }
        .warn { color: #ffb703; font-weight: bold; }
        .subtext { color: #d0c0cc; font-size: 1rem; margin-top: 5px; line-height: 1.5; }

        .btn-action {
            margin-top: 15px;
            padding: 12px 22px;
            background: transparent;
            border: 1px solid #ff2a6d;
            color: #ff2a6d;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            width: fit-content;
            display: flex;
            align-items: center;
            gap: 8px;
            border-radius: 8px;
        }

        .btn-action:active {
            background: #ff2a6d;
            color: #000;
            box-shadow: 0 0 15px #ff2a6d;
            transform: scale(0.96);
        }

        /* ซ่อนการ์ดคำถามขั้นตอนอื่นๆ ไว้ก่อน */
        .hidden-card {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: scale(0.9);
        }

        /* หน้าแสดงรูปหัวใจตัวอักษรวิ่ง */
        #heart-container {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .text-node {
            position: absolute;
            font-weight: 800;
            white-space: nowrap;
            user-select: none;
            transform: translate(-50%, -50%);
            opacity: 0;
            font-family: 'Courier New', Courier, monospace;
            animation: flyIn 2.8s cubic-bezier(0.22, 1, 0.36, 1) forwards, pulse 2s infinite ease-in-out 2.8s;
        }

        @keyframes flyIn {
            0% {
                top: 110% !important;
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.2);
            }
            40% {
                opacity: 0.7;
            }
            100% {
                opacity: var(--final-opacity);
                transform: translate(-50%, -50%) scale(1);
            }
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.08); }
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <!-- ขั้นตอนที่ 1: หน้า Terminal เริ่มต้น -->
        <div id="step-1" class="card-box">
            <div class="line"><span class="system">[system]</span> Initializing heart.PROTOCOL_v2.0 ...</div>
            <div class="line"><span class="system">[status]</span> <span class="status">READY</span></div>
            <div class="subtext">> พบข้อความลับส่งถึงคุณ 1 ข้อความ</div>
            <button class="btn-action" onclick="goToStep(2)">🔒 DECRYPT MESSAGE</button>
        </div>

        <!-- ขั้นตอนที่ 2: ถามว่า แน่ใจจะดูนะ? -->
        <div id="step-2" class="card-box hidden-card">
            <div class="line"><span class="system">[confirm]</span> CHECKING...</div>
            <div class="subtext">แน่ใจนะว่าจะเปิดดูจริงเหรอ? 😳</div>
            <button class="btn-action" onclick="goToStep(3)">แน่ใจสิ กดเลย! 👉</button>
        </div>

        <!-- ขั้นตอนที่ 3: บอกว่า ผมเขินนะ! -->
        <div id="step-3" class="card-box hidden-card">
            <div class="line"><span class="system">[warning]</span> SHY_LEVEL_MAX</div>
            <div class="subtext">แต่เค้าเปิดให้ดูแล้วเค้าเขินนะ... 🫣❤️</div>
            <button class="btn-action" onclick="goToStep(4)">โอ๋ๆ ไม่ต้องเขิน ไปต่อเร็ว 🥺</button>
        </div>

        <!-- ขั้นตอนที่ 4: เตือนแล้วนะ! -->
        <div id="step-4" class="card-box hidden-card">
            <div class="line"><span class="system">[final_notice]</span> <span class="warn">WARNING</span></div>
            <div class="subtext">เตือนแล้วนะ!! ห้ามยิ้มคนเดียวนะ... ⚠️🥰</div>
            <button class="btn-action" onclick="startHeartAnimation()">พร้อมแล้ว ดูเลย! ❤️</button>
        </div>

        <!-- หน้าแสดงรูปหัวใจตัวอักษรวิ่ง -->
        <div id="heart-container"></div>
    </div>

    <script>
        // ฟังก์ชั่นเปลี่ยนการ์ดคำถามทีละขั้นตอน
        function goToStep(nextStepNum) {
            const currentCard = document.querySelector('.card-box:not(.hidden-card)');
            if (currentCard) {
                currentCard.style.opacity = '0';
                currentCard.style.transform = 'scale(0.85)';
                setTimeout(() => {
                    currentCard.classList.add('hidden-card');
                    
                    const nextCard = document.getElementById(`step-${nextStepNum}`);
                    if (nextCard) {
                        nextCard.classList.remove('hidden-card');
                        setTimeout(() => {
                            nextCard.style.opacity = '1';
                            nextCard.style.transform = 'scale(1)';
                        }, 50);
                    }
                }, 400);
            }
        }

        // ฟังก์ชั่นเริ่มแสดงตัวอักษรลอยขึ้นมาเป็นรูปหัวใจ
        function startHeartAnimation() {
            const lastCard = document.getElementById('step-4');
            lastCard.style.opacity = '0';
            lastCard.style.transform = 'scale(0.8)';
            setTimeout(() => {
                lastCard.style.visibility = 'hidden';
            }, 500);

            const container = document.getElementById('heart-container');
            container.style.display = 'block';

            const frame = document.querySelector('.phone-frame');
            const width = frame.clientWidth;
            const height = frame.clientHeight;
            
            const scale = Math.min(width, height) / 38;

            let delayCounter = 0;

            // 1. ตัวอักษรตามขอบรูปหัวใจ
            for (let t = 0; t < Math.PI * 2; t += 0.08) {
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

                const targetX = (width / 2) + (x * scale);
                const targetY = (height / 2) + (y * scale) - 15;

                createHeartText(container, targetX, targetY, delayCounter);
                delayCounter += 0.04;
            }

            // 2. ตัวอักษรเติมเต็มข้างในหัวใจ
            for (let i = 0; i < 140; i++) {
                const t = Math.random() * Math.PI * 2;
                const r = Math.sqrt(Math.random());
                
                const x = r * (16 * Math.pow(Math.sin(t), 3));
                const y = r * (-(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)));

                const targetX = (width / 2) + (x * scale);
                const targetY = (height / 2) + (y * scale) - 15;

                createHeartText(container, targetX, targetY, delayCounter);
                delayCounter += 0.025;
            }
        }

        function createHeartText(container, targetX, targetY, delay) {
            const span = document.createElement('span');
            span.className = 'text-node';
            span.innerText = 'i love you';
            
            span.style.left = `${targetX}px`;
            span.style.top = `${targetY}px`;

            const fontSize = Math.random() * 5 + 9;
            const opacity = Math.random() * 0.6 + 0.4;
            
            span.style.fontSize = `${fontSize}px`;
            span.style.color = `rgba(255, 42, 109, ${opacity})`;
            span.style.setProperty('--final-opacity', opacity);
            
            span.style.animationDelay = `${delay}s, ${delay + 2.8}s`;

            container.appendChild(span);
        }
    </script>
</body>
</html>

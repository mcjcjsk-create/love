<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Heart Protocol</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0d0208;
            color: #ff2a6d;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .phone-frame {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 420px;
            max-height: 860px;
            background: #0d0208;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 50px rgba(255, 42, 109, 0.25);
        }

        @media (min-width: 480px) {
            .phone-frame {
                height: 90vh;
                border-radius: 40px;
                border: 8px solid #220a16;
            }
        }

        .card-box {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 88%;
            background: rgba(20, 5, 12, 0.92);
            padding: 25px 20px;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(255, 42, 109, 0.3);
            border: 1px solid rgba(255, 42, 109, 0.35);
            font-family: 'Courier New', Courier, monospace;
            z-index: 10;
            transition: opacity 0.5s ease, transform 0.5s ease, visibility 0.5s ease;
            position: absolute;
        }

        .line { font-size: 0.95rem; letter-spacing: 0.5px; line-height: 1.4; }
        .system { color: #ff2a6d; }
        .status { color: #00ff66; font-weight: bold; }
        .warn { color: #ffb703; font-weight: bold; }
        .subtext { color: #d0c0cc; font-size: 1rem; margin-top: 5px; line-height: 1.5; }

        .btn-action {
            margin-top: 15px;
            padding: 12px 22px;
            background: transparent;
            border: 1px solid #ff2a6d;
            color: #ff2a6d;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            width: fit-content;
            display: flex;
            align-items: center;
            gap: 8px;
            border-radius: 8px;
        }

        .btn-action:active {
            background: #ff2a6d;
            color: #000;
            box-shadow: 0 0 15px #ff2a6d;
            transform: scale(0.96);
        }

        .hidden-card {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: scale(0.9);
        }

        #heart-container {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .text-node {
            position: absolute;
            font-weight: 800;
            white-space: nowrap;
            user-select: none;
            transform: translate(-50%, -50%);
            opacity: 0;
            font-family: 'Courier New', Courier, monospace;
            animation: flyIn 2.8s cubic-bezier(0.22, 1, 0.36, 1) forwards, pulse 2s infinite ease-in-out 2.8s;
        }

        @keyframes flyIn {
            0% { top: 110% !important; opacity: 0; transform: translate(-50%, -50%) scale(0.2); }
            40% { opacity: 0.7; }
            100% { opacity: var(--final-opacity); transform: translate(-50%, -50%) scale(1); }
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); filter: drop-shadow(0 0 2px #ff2a6d); }
            50% { transform: translate(-50%, -50%) scale(1.08); filter: drop-shadow(0 0 8px #ff2a6d); }
        }

        .bg-heart {
            position: absolute;
            color: #ff2a6d;
            user-select: none;
            pointer-events: none;
            animation: floatUp 4s linear forwards;
            z-index: 1;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5); opacity: 0.8; }
            100% { transform: translateY(-100vh) scale(1.2) rotate(20deg); opacity: 0; }
        }

        .tap-pop {
            position: absolute;
            color: #ff758c;
            font-size: 0.9rem;
            font-weight: bold;
            pointer-events: none;
            user-select: none;
            z-index: 20;
            white-space: nowrap;
            animation: popAndFade 1.5s ease-out forwards;
        }

        @keyframes popAndFade {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            20% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
            100% { opacity: 0; transform: translate(-50%, -80px) scale(1); }
        }
    </style>
</head>
<body>

    <!-- แท็กเล่นไฟล์เพลง KIMGUN - PRETTY GIRL Official MV.mp3 -->
    <audio id="bgm" loop preload="auto">
        <source src="KIMGUN%20-%20PRETTY%20GIRL%20Official%20MV.mp3" type="audio/mpeg">
        <source src="KIMGUN - PRETTY GIRL Official MV.mp3" type="audio/mpeg">
    </audio>

    <div class="phone-frame" id="main-frame" onclick="handleTap(event)">
        <!-- ขั้นตอนที่ 1 -->
        <div id="step-1" class="card-box">
            <div class="line"><span class="system">[system]</span> Initializing heart.PROTOCOL_v2.0 ...</div>
            <div class="line"><span class="system">[status]</span> <span class="status">READY</span></div>
            <div class="subtext">> พบข้อความลับส่งถึงคุณ 1 ข้อความ</div>
            <button class="btn-action" onclick="playMusic(); goToStep(2);">🔒 DECRYPT MESSAGE</button>
        </div>

        <!-- ขั้นตอนที่ 2 -->
        <div id="step-2" class="card-box hidden-card">
            <div class="line"><span class="system">[confirm]</span> CHECKING...</div>
            <div class="subtext">แน่ใจนะว่าจะเปิดดูจริงเหรอ? 😳</div>
            <button class="btn-action" onclick="playMusic(); goToStep(3);">แน่ใจสิ กดเลย! 👉</button>
        </div>

        <!-- ขั้นตอนที่ 3 -->
        <div id="step-3" class="card-box hidden-card">
            <div class="line"><span class="system">[warning]</span> SHY_LEVEL_MAX</div>
            <div class="subtext">แต่เปิดให้ดูแล้วเค้าเขินนะ... 🫣❤️</div>
            <button class="btn-action" onclick="playMusic(); goToStep(4);">โอ๋ๆ ไม่ต้องเขิน ไปต่อเร็ว 🥺</button>
        </div>

        <!-- ขั้นตอนที่ 4 -->
        <div id="step-4" class="card-box hidden-card">
            <div class="line"><span class="system">[final_notice]</span> <span class="warn">WARNING</span></div>
            <div class="subtext">เตือนแล้วนะ!! ห้ามยิ้มคนเดียวนะ... ⚠️🥰</div>
            <button class="btn-action" onclick="startHeartAnimation()">พร้อมแล้ว ดูเลย! ❤️</button>
        </div>

        <div id="heart-container"></div>
    </div>

    <script>
        function playMusic() {
            const audio = document.getElementById('bgm');
            if (audio) {
                audio.play().catch(e => console.log("Audio Play Error:", e));
            }
        }

        let isAnimationStarted = false;

        function goToStep(nextStepNum) {
            playMusic();
            const currentCard = document.querySelector('.card-box:not(.hidden-card)');
            if (currentCard) {
                currentCard.style.opacity = '0';
                currentCard.style.transform = 'scale(0.85)';
                setTimeout(() => {
                    currentCard.classList.add('hidden-card');
                    
                    const nextCard = document.getElementById(`step-${nextStepNum}`);
                    if (nextCard) {
                        nextCard.classList.remove('hidden-card');
                        setTimeout(() => {
                            nextCard.style.opacity = '1';
                            nextCard.style.transform = 'scale(1)';
                        }, 50);
                    }
                }, 400);
            }
        }

        function startHeartAnimation() {
            playMusic();
            isAnimationStarted = true;
            const lastCard = document.getElementById('step-4');
            lastCard.style.opacity = '0';
            lastCard.style.transform = 'scale(0.8)';
            setTimeout(() => {
                lastCard.style.visibility = 'hidden';
            }, 500);

            const container = document.getElementById('heart-container');
            container.style.display = 'block';

            const frame = document.querySelector('.phone-frame');
            const width = frame.clientWidth;
            const height = frame.clientHeight;
            
            const scale = Math.min(width, height) / 38;

            let delayCounter = 0;

            for (let t = 0; t < Math.PI * 2; t += 0.08) {
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

                const targetX = (width / 2) + (x * scale);
                const targetY = (height / 2) + (y * scale) - 15;

                createHeartText(container, targetX, targetY, delayCounter);
                delayCounter += 0.04;
            }

            for (let i = 0; i < 140; i++) {
                const t = Math.random() * Math.PI * 2;
                const r = Math.sqrt(Math.random());
                
                const x = r * (16 * Math.pow(Math.sin(t), 3));
                const y = r * (-(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)));

                const targetX = (width / 2) + (x * scale);
                const targetY = (height / 2) + (y * scale) - 15;

                createHeartText(container, targetX, targetY, delayCounter);
                delayCounter += 0.025;
            }

            setInterval(spawnFloatingHeart, 400);
        }

        function createHeartText(container, targetX, targetY, delay) {
            const span = document.createElement('span');
            span.className = 'text-node';
            span.innerText = 'i love you';
            
            span.style.left = `${targetX}px`;
            span.style.top = `${targetY}px`;

            const fontSize = Math.random() * 5 + 9;
            const opacity = Math.random() * 0.6 + 0.4;
            
            span.style.fontSize = `${fontSize}px`;
            span.style.color = `rgba(255, 42, 109, ${opacity})`;
            span.style.setProperty('--final-opacity', opacity);
            
            span.style.animationDelay = `${delay}s, ${delay + 2.8}s`;

            container.appendChild(span);
        }

        function spawnFloatingHeart() {
            const frame = document.getElementById('main-frame');
            const heart = document.createElement('div');
            heart.className = 'bg-heart';
            
            const icons = ['💖', '💕', '✨', '🌸', '❤️'];
            heart.innerText = icons[Math.floor(Math.random() * icons.length)];
            
            heart.style.left = `${Math.random() * 90 + 5}%`;
            heart.style.top = '100%';
            heart.style.fontSize = `${Math.random() * 12 + 10}px`;
            
            frame.appendChild(heart);

            setTimeout(() => { heart.remove(); }, 4000);
        }

        const lovePhrases = [
            'รักเธอนะ ❤️', 'คิดถึงจัง 🥺', 'น่ารักที่สุด 🥰', 
            'อยู่ด้วยกันนานๆ นะ ✨', 'ยิ้มเยอะๆ น้า 😊', 'คนเก่งของเค้า 💖', 
            'i love you 3000 💕','ฟังเพลงให้จบนะคะ'
        ];

        function handleTap(e) {
            if (!isAnimationStarted) return;

            const frame = document.getElementById('main-frame');
            const rect = frame.getBoundingClientRect();
            
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const pop = document.createElement('div');
            pop.className = 'tap-pop';
            pop.innerText = lovePhrases[Math.floor(Math.random() * lovePhrases.length)];
            
            pop.style.left = `${x}px`;
            pop.style.top = `${y}px`;

            frame.appendChild(pop);

            setTimeout(() => { pop.remove(); }, 1500);
        }
    </script>
</body>
</html>
